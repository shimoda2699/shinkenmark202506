<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情報I 全統マーク模試 2025年11月｜第3問</title>
<style>
  :root{--bg:#f0f4f8;--card:#fff;--primary:#1a56a0;--primary-light:#e8f0fb;--correct:#1a7a4a;--correct-bg:#e6f4ec;--wrong:#b91c1c;--wrong-bg:#fde8e8;--text:#1e2a3a;--muted:#5a6a7e;--border:#d0dae6;--radius:10px;--shadow:0 2px 12px rgba(26,86,160,.08);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--primary);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.18);}
  header h1{font-size:.95rem;font-weight:700;}
  .progress-wrap{display:flex;align-items:center;gap:10px;}
  .progress-label{font-size:.78rem;opacity:.9;white-space:nowrap;}
  .progress-bar{width:110px;height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:#7ec8f7;border-radius:3px;transition:width .3s;}
  main{max-width:780px;margin:0 auto;padding:18px 14px 90px;}
  .sec-title{background:var(--primary);color:#fff;font-weight:700;font-size:.95rem;padding:8px 16px;border-radius:8px;margin:26px 0 12px;}
  .context{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;font-size:.92rem;line-height:1.85;}
  .context p{margin-bottom:.7em;}
  .context table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.85rem;}
  .context th,.context td{border:1px solid var(--border);padding:6px 8px;}
  .context th{background:var(--primary-light);font-weight:700;}
  .fig{background:var(--primary-light);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin:10px 0;font-size:.86rem;line-height:1.75;}
  .fig-cap{font-weight:700;color:var(--primary);font-size:.8rem;margin-bottom:4px;}
  .blank{display:inline-block;border:1.5px solid var(--text);padding:0 10px;font-weight:700;background:#fff;border-radius:3px;}
  u.point{text-underline-offset:3px;}
  .q-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;}
  .q-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .q-badge{background:var(--primary);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .q-point{font-size:.72rem;color:var(--muted);}
  .q-status{margin-left:auto;font-size:.95rem;}
  .q-text{font-size:.92rem;line-height:1.8;margin-bottom:10px;}
  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice-btn{display:flex;align-items:flex-start;gap:10px;background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:9px 13px;cursor:pointer;text-align:left;font-size:.87rem;line-height:1.55;transition:border-color .15s,background .15s;width:100%;font-family:inherit;}
  .choice-btn:hover:not(:disabled){border-color:var(--primary);background:var(--primary-light);}
  .choice-btn .ci{font-weight:700;color:var(--primary);min-width:20px;}
  .choice-btn.selected{border-color:var(--primary);background:var(--primary-light);}
  .choice-btn.correct{border-color:var(--correct);background:var(--correct-bg);}
  .choice-btn.wrong{border-color:var(--wrong);background:var(--wrong-bg);}
  .choice-btn:disabled{cursor:default;}
  .pick-hint{font-size:.78rem;color:var(--muted);margin:-2px 0 8px;}
  .digits-row{display:flex;align-items:center;gap:6px;margin:6px 0 4px;flex-wrap:wrap;}
  .digit-prefix,.digit-suffix{font-size:.9rem;font-weight:700;}
  .digit-box{width:2.4em;height:2.4em;text-align:center;font-size:1.1rem;font-weight:700;border:2px solid var(--border);border-radius:6px;background:#fff;color:var(--text);}
  .digit-box:focus{outline:none;border-color:var(--primary);background:var(--primary-light);}
  .digit-box.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);}
  .digit-box.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong);}
  .digit-answer{font-size:.8rem;color:var(--muted);margin-left:8px;}
  .blank-group{margin:12px 0;padding:10px 12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);}
  .blank-group-label{font-weight:700;color:var(--primary);font-size:.85rem;margin-bottom:6px;}
  .action-row{margin-top:12px;display:flex;justify-content:flex-end;}
  .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:.88rem;font-weight:700;cursor:pointer;}
  .btn-primary:hover{background:#154080;}
  .btn-primary:disabled{background:#b6c2d0;cursor:default;}
  .btn-secondary{background:#fff;color:var(--primary);border:2px solid var(--primary);border-radius:8px;padding:9px 18px;font-size:.88rem;font-weight:700;cursor:pointer;}
  .result-banner{display:none;border-radius:8px;padding:10px 14px;margin-top:12px;font-size:.88rem;font-weight:600;align-items:center;gap:10px;flex-wrap:wrap;}
  .result-banner.show{display:flex;}
  .result-banner.correct{background:var(--correct-bg);color:var(--correct);}
  .result-banner.wrong{background:var(--wrong-bg);color:var(--wrong);}
  .explanation-link{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--primary);border:1.5px solid var(--primary);padding:4px 12px;border-radius:20px;cursor:pointer;background:#fff;}
  .explanation-link:hover{background:var(--primary-light);}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:200;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:12px;max-width:680px;width:100%;max-height:85vh;overflow-y:auto;padding:22px;box-shadow:0 8px 40px rgba(0,0,0,.2);}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-title{font-size:.95rem;font-weight:700;color:var(--primary);}
  .modal-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);line-height:1;}
  .modal-body{font-size:.89rem;line-height:1.85;}
  .modal-body .correct-answer{background:var(--correct-bg);border-left:4px solid var(--correct);padding:8px 12px;border-radius:4px;margin-bottom:12px;font-weight:700;color:var(--correct);}
  .modal-body p{margin-bottom:.7em;}
  .opt-exp{margin:6px 0;padding:6px 10px;background:var(--bg);border-radius:6px;font-size:.85rem;}
  .opt-exp.ok{border-left:3px solid var(--correct);}
  .opt-exp.ng{border-left:3px solid var(--wrong);}
  .label-ok{color:var(--correct);font-weight:700;}
  .label-ng{color:var(--wrong);font-weight:700;}
  #final-area{margin-top:30px;}
  .result-table{width:100%;border-collapse:collapse;margin-top:18px;font-size:.86rem;}
  .result-table th,.result-table td{border:1px solid var(--border);padding:6px 9px;text-align:center;}
  .result-table th{background:var(--primary-light);font-weight:700;}
  .result-table td.ok{color:var(--correct);font-weight:700;}
  .result-table td.ng{color:var(--wrong);font-weight:700;}
  .score-big{font-size:2.8rem;font-weight:800;color:var(--primary);}
  .score-denom{font-size:1.1rem;color:var(--muted);}
  @media(max-width:540px){.context,.q-card{padding:14px;}.choice-btn{font-size:.83rem;}.progress-bar{width:70px;}.score-big{font-size:2.2rem;}}

  /* トップページへ戻るボタン */
  .back-to-index-wrap{max-width:800px;margin:14px auto;padding:0 16px;text-align:left;}
  .back-to-index-wrap.bottom{margin:28px auto 36px;text-align:center;}
  .back-to-index-btn{display:inline-block;background:var(--primary,#1a56a0);color:#fff;text-decoration:none;padding:8px 18px;border-radius:8px;font-weight:700;font-size:.88rem;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  .back-to-index-btn:hover{background:#154080;}

  /* 図表（画像）と図表リンク */
  .fig-img-wrap{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;margin:12px 0;text-align:center;}
  .fig-img-wrap .fig-cap{text-align:left;}
  .fig-img{max-width:100%;height:auto;display:block;margin:4px auto 0;cursor:zoom-in;}
  .fig-zoom-hint{font-size:.72rem;color:var(--muted);margin-top:4px;}
  .fig-links{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 2px;}
  .fig-links-label{font-size:.78rem;color:var(--muted);}
  .fig-link{font-family:inherit;font-size:.82rem;font-weight:700;color:var(--primary);background:var(--primary-light);border:1.5px solid var(--primary);border-radius:20px;padding:5px 14px;cursor:pointer;}
  .fig-link::before{content:"📊 ";}
  .fig-link:hover{background:#d6e4f7;}
  .lb-overlay{display:none;position:fixed;inset:0;background:rgba(10,20,40,.95);z-index:300;flex-direction:column;}
  .lb-overlay.show{display:flex;}
  .lb-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;}
  .lb-cap{font-size:.86rem;font-weight:700;flex:1;line-height:1.4;}
  .lb-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:6px 12px;font-size:.82rem;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .lb-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center;padding:8px;}
  .lb-body img{max-width:100%;max-height:100%;background:#fff;border-radius:4px;}
  .lb-body.zoom{align-items:flex-start;justify-content:flex-start;}
  .lb-body.zoom img{max-width:none;max-height:none;width:200%;}
  .lb-foot{color:rgba(255,255,255,.7);font-size:.72rem;text-align:center;padding:6px 0 12px;}
</style>
</head>
<body>

<header>
  <h1>情報Ⅰ 2025年11月（全統マーク模試）｜第3問（配点25）</h1>
  <div class="progress-wrap">
    <span class="progress-label" id="prog-label">0 / 0 回答</span>
    <div class="progress-bar"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
</header>
<div class="back-to-index-wrap top"><a class="back-to-index-btn" href="zentou.html">← トップへ戻る</a></div>

<main id="quiz-area"></main>
<div class="back-to-index-wrap bottom"><a class="back-to-index-btn" href="zentou.html">↑ トップへ戻る</a></div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">解説</span>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>


<div class="lb-overlay" id="lb" onclick="if(event.target===this||event.target.id==='lb-body')closeFig()">
  <div class="lb-bar">
    <span class="lb-cap" id="lb-cap"></span>
    <button class="lb-btn" onclick="toggleZoom()" id="lb-zoom">拡大</button>
    <button class="lb-btn" onclick="closeFig()">✕ 閉じる</button>
  </div>
  <div class="lb-body" id="lb-body"><img id="lb-img" alt="" onclick="toggleZoom()"></div>
  <div class="lb-foot">画像をタップで拡大／縮小・背景タップで閉じる</div>
</div>
<script>
const SYM = ['⓪','①','②','③','④','⑤','⑥','⑦','⑧','⑨','ⓐ','ⓑ','ⓒ','ⓓ'];

// ===== 図表の登録（imgフォルダの画像を参照） =====
const FIGS = {
  "図1": {label:"図1", src:"img/zen202511_3_fig1_article.jpg",    cap:"図1　C市の広報記事（新しい年齢区分と料金体系）"},
  "図2": {label:"図2", src:"img/zen202511_3_fig2_nyujo.jpg",      cap:"図2　区分を記録する配列Nyujo"},
  "図3": {label:"図3", src:"img/zen202511_3_fig3_count.jpg",      cap:"図3　各区分の人数を数えるプログラム"},
  "図4": {label:"図4", src:"img/zen202511_3_fig4_fee.jpg",        cap:"図4　入場料金の合計を計算するプログラム（一部）"},
  "図5": {label:"図5", src:"img/zen202511_3_fig5_attraction.jpg", cap:"図5　アトラクションⅠの利用料金の合計を計算するプログラム（一部）"}
};
const code = s => `<code style="font-family:Consolas,Menlo,monospace;font-size:.9em">${s}</code>`;
const IU = ["ryokin","ryokin * 2","ryokin * 0.5","ryokin * 0.25"].map(code);
const KK = ["z ÷ 3","z % 3","z * 3","z - 3"].map(code);
const KUKO = ["0","1","2","3"].map(code);
// 図表を本文中に表示（タップで拡大）
function figBox(key){ const f=FIGS[key]; return `<div class="fig-img-wrap"><div class="fig-cap">${f.cap}</div><img class="fig-img" src="${f.src}" alt="${f.cap}" loading="lazy" onclick="openFig('${key}')"><div class="fig-zoom-hint">タップで拡大</div></div>`; }
// 設問中の「表1」などのリンク（チップ）
function figLink(key){ const f=FIGS[key]; return `<button type="button" class="fig-link" onclick="openFig('${key}')">${f.label||key}</button>`; }
function figLinks(...keys){ return `<div class="fig-links"><span class="fig-links-label">図表を確認：</span>${keys.map(k=>figLink(k)).join('')}</div>`; }
function B(s){ return `<span class="blank">${s}</span>`; }

// ===== セクション（問題文）と設問データ =====
const sections = [

// ───────── 共通・問1 ─────────
{
  title: "第3問　次の文章を読み，後の問い（問1〜3）に答えよ。（配点 25）",
  context: `
<p>　図1のC市の広報記事を見たUさんは，記事にある料金体系から入場料金を計算するプログラムを作成してみようと考え，学校でT先生に相談した。</p>
${figBox("図1")}
<div class="fig">C市内のアミューズメントパークの入場料金は長らく「大人・小人」の二つの年齢区分で運営されてきたが，利用者の要望により，次のように見直された。<br>
Z区分：3才以下（料金比率 1/4）／Y区分：4才〜15才（1/2）／A区分：16才〜59才（1）／S区分：60才以上（1/2）</div>
<p>Uさん：入場するグループの入場料金の合計を計算するプログラムを作るには，グループの区分ごとの人数を数えることが必要なので，Nyujoという配列を用意して，それぞれの入場者の区分（A，S，Y，Z）を文字列として記録してはどうでしょう。<br>
T先生：そうですね。区分は，入場時に各自が入力するものとしましょう。</p>
${figBox("図2")}
<p>Uさん：配列Nyujo中のA，S，Y，Zの個数をどうやって数えたらいいですか。<br>
T先生：比較演算子「==」を用いて，配列Nyujoの各要素がA，S，Y，Zのどれに一致するかを調べ，A，S，Y，Zそれぞれの個数を表すための変数a，s，y，zを用意してカウントしてはどうかな。<br>
Uさん：なるほど！　やってみます。</p>
<p>　Uさんはさっそくプログラムの作成に取りかかった。ここで，入場時に入力されたグループの区分は配列Nyujoの要素として記録されており，変数a，s，y，zの初期値を0とする。配列の添字は0から始まるものとし，要素数(配列名)は引数に指定した配列の要素数を返す関数である。例えば，配列Dataが["A", "A", "S", "Z"]のとき，要素数(Data)は4を返す。</p>`,
  items: [
    {
      label:"問1（ア）", points:3, type:"single",
      qtext:`図3はUさんが作ったプログラムである。(03)行目　${code('i')} を${B('ア')}まで1ずつ増やしながら繰り返す：　空欄${B('ア')}に入れるのに最も適当なものを，解答群のうちから一つ選べ。${figBox("図3")}`,
      choices:["1から要素数(Nyujo)","1から要素数(Nyujo) - 1","0から要素数(Nyujo)","0から要素数(Nyujo) - 1"].map(code),
      correct:3,
      exp:{answer:"③",
        text:`配列Nyujoに要素として含まれる文字A，S，Y，Zのそれぞれの個数を数えるために比較演算子「==」を用いる。「配列の添字は0から始まる」ので，Nyujoの添字は0からNyujoの要素数－1までの値となる。図3では変数iを用意して，Nyujo[i]の値により条件分岐を行っている。Nyujoのすべての要素について条件分岐を行うためには，iを0から要素数(Nyujo) - 1まで動かせばよい。`}
    }
  ]
},

// ───────── 問2 ─────────
{
  title: `問2　次の文章を参考に，図4のプログラムの空欄${B('イ')}〜${B('エ')}に入れるのに最も適当なものを，後の解答群のうちから一つずつ選べ。`,
  context: `
<p>Uさん：各区分の人数をカウントできたので，入場料金の合計を計算するプログラムを作ろうと思います。そのために，各区分の人数をまとめる配列を定めます。また，図1のように各区分の料金はA区分の料金が基準になっているので，このA区分の1人の料金を表す変数を定めます。A区分1人の料金は現在1000円ですが，料金が変わっても使えるプログラムにするために，プログラム中では変数として扱うことにします。<br>
T先生：残りの区分の料金はどのように扱いますか。<br>
Uさん：各区分の料金を要素とする配列を定めることにします。</p>
<p>　Uさんは図3のプログラムの後に，このグループに対する入場料金の合計を計算する部分を追加することにした。はじめに，四つの区分（A，S，Y，Z）それぞれの人数を配列Kubunに代入する。A区分の料金を基準として他の区分の料金が決まっているので，A区分1人の料金を変数ryokinとし，他の区分の料金はこの変数に定数を掛けて表し，これらを配列Ryokin_kubunの初期値とする。配列Ryokin_kubun中の要素の順序は，配列Kubun中の要素の順序に対応するものとする。入場料金の合計を計算するための変数nyujoryoを導入し，初期値を0とする。配列Ryokin_kubunの各料金を参照することにより入場料金の合計を計算する。</p>
${figBox("図4")}`,
  items: [
    {
      label:"イ", points:3, type:"single",
      qtext:`図4の(15)行目　${code('Ryokin_kubun = [ryokin, ryokin * 0.5, ')}${B('イ')}${code(', ')}${B('ウ')}${code(']')}　空欄${B('イ')}に入れるものを選べ。${figLinks("図1","図4")}`,
      choices:IU, correct:2,
      exp:{answer:"②（ryokin * 0.5）",
        text:`配列Kubunは，A区分，S区分，Y区分，Z区分の人数をこの順に要素としており，各区分に対する入場料金はA区分の料金に対する比率で定めている。図1から，S区分，Y区分，Z区分の料金はA区分の料金のそれぞれ0.5倍，0.5倍，0.25倍であり，${B('イ')}，${B('ウ')}はそれぞれY区分，Z区分の料金なので②と③が当てはまる。`}
    },
    {
      label:"ウ", points:3, type:"single",
      qtext:`図4の(15)行目の空欄${B('ウ')}に入れるものを選べ。${figLinks("図1","図4")}`,
      choices:IU, correct:3,
      exp:{answer:"③（ryokin * 0.25）",
        text:`配列Ryokin_kubunの要素はKubunと同じくA，S，Y，Zの順である。${B('ウ')}はZ区分（3才以下，料金比率1/4）の料金なので ${code('ryokin * 0.25')} が当てはまる。`}
    },
    {
      label:"エ", points:3, type:"single",
      qtext:`図4の(17)行目　${code('nyujoryo = nyujoryo + ')}${B('エ')}${figLinks("図4")}`,
      choices:["Kubun[i] + Ryokin_kubun[i]","Kubun[i] * Ryokin_kubun[i]","Kubun[i] - Ryokin_kubun[i]","Kubun[i] / Ryokin_kubun[i]"].map(code),
      correct:1,
      exp:{answer:"①（Kubun[i] * Ryokin_kubun[i]）",
        text:`図4の(16)，(17)行目は，繰り返しによる料金の合計の計算である。A，S，Y，Zの各区分の人数を要素とする配列Kubunと，A，S，Y，Zの各区分の料金を要素とする配列Ryokin_kubunから，各区分の料金の合計を計算することができる。変数nyujoryoの初期値を0とし，各区分の1人分の料金に人数を掛けて加えることを繰り返して料金の合計を計算している。`}
    }
  ]
},

// ───────── 問3 ─────────
{
  title: `問3　次の文章を参考に，図5のプログラムの空欄${B('オ')}〜${B('コ')}に入れるのに最も適当なものを，後の解答群のうちから一つずつ選べ。`,
  context: `
<p>　Uさんは，問1，2で入場料金の合計を計算したグループの全員が，パーク内のアトラクションⅠを利用するときの利用料金の合計を計算するプログラムも考えることにした。アトラクションⅠの料金体系は，A区分1人の利用料金が500円で，他の区分の利用料金はA区分の利用料金をもとに入場料金と同じ比率となっている。ただし，利用料金を払った者はZ区分2人まで無料で同伴でき，3人目からはZ区分の料金が生じるものとする。例えば，A区分1人とZ区分3人のグループの利用料金はA区分1人分とZ区分1人分の合計となる。また，料金を払ったZ区分の利用者にもZ区分2人まで無料の同伴が認められるため，A区分1人とZ区分4人のグループの利用料金もA区分1人分とZ区分1人分の合計となる。</p>
<p>Uさん：アトラクションⅠの各区分の利用料金設定は入場料金の料金体系での比率と同じなので，ryokinの値を500として，図4のプログラムと同じように考えればよいと思います。<br>
T先生：そうですね。ただし，各区分の人数をそのまま用いるのではなく，利用料金が発生する人数をどう数えるかを考える必要があります。<br>
Uさん：A，S，Y区分の合計人数の2倍がZ区分の人数以上であれば，Z区分全員が無料となります。<br>
T先生：Z区分で有料となる人が出る場合はどうなりますか。<br>
Uさん：A，S，Y区分の合計人数の2倍をZ区分の人数から除いて，残ったZ区分の人数に応じた利用料金を支払う必要があります。Z区分の1人分の利用料金を支払えばZ区分の2人まで同伴者とみなされて無料になるので，残った人数を3で割ったときの余りに着目して考えてみようと思います。<br>
T先生：それはよい発想ですね。</p>
<p>　Uさんは図4のプログラムの(18)行目の後ろに図5のプログラムを書き加えた。(19)〜(26)行目で利用料金が発生するZ区分の人数を求めている。また，(27)，(28)行目でA，S，Y区分の人数と，利用料金が発生するZ区分の人数を用いて，配列Kubunの再設定を行い，ryokinの値を500に変更する。さらに，アトラクションⅠの利用料金の合計を計算するための変数としてryokin_atを導入し，初期値を0としておく。続く(29)〜(32)行目で利用料金の合計を計算して表示する。なお，算術演算子「÷」と「%」は，それぞれ整数の除算における商（整数）と余りを返す。</p>
${figBox("図5")}`,
  items: [
    {
      label:"オ", points:2, type:"single",
      qtext:`図5の(19)行目　もし${B('オ')} >= ${B('カ')}ならば：　空欄${B('オ')}に入れるものを選べ。${figLinks("図5")}`,
      choices:["a * 2","(a + s) * 2","(a + s + y) * 2","(a + s + y + z) * 2"].map(code),
      correct:2,
      exp:{answer:"②（(a + s + y) * 2）",
        text:`図5の(19)行目では，会話文での説明からA，S，Y区分の人数の2倍（(a + s + y) * 2）とZ区分の人数の比較を行っている。前者が後者以上であればZ区分の全員が無料となるから，(20)行目でZ区分の人数の（0への）読み替えを行っている。よって，(19)行目の不等式は「${code('(a + s + y) * 2 >= z')}」になる。`}
    },
    {
      label:"カ", points:2, type:"single",
      qtext:`図5の(19)行目の空欄${B('カ')}に入れるものを選べ。${figLinks("図5")}`,
      choices:["a","s","y","z"].map(code), correct:3,
      exp:{answer:"③（z）",
        text:`(19)行目は，A，S，Y区分の人数の2倍とZ区分の人数 z を比較する。よって${B('カ')}は ${code('z')} である。(22)行目の「${code('z = ')}${B('カ')}${code(' - ')}${B('オ')}」も「${code('z = z - (a + s + y) * 2')}」となり，無料の同伴から漏れたZ区分の人数を計算している。`}
    },
    {
      label:"キ", points:2, type:"single",
      qtext:`図5の(23)行目　もし${B('キ')} == ${B('ク')}ならば：　空欄${B('キ')}に入れるものを選べ。${figLinks("図5")}`,
      choices:KK, correct:1,
      exp:{answer:"①（z % 3）",
        text:`図5の(22)行目は，A，S，Y区分の人数による無料の同伴から漏れたZ区分の人数（z）を計算している。この人数zに対して，Z区分内の人数による無料の同伴を考えることになる。zを3で割った余りに着目すると，割り切れるときはzの3分の1の人数分の利用料金となるため，(23)行目の「${B('キ')} == ${B('ク')}」は「${code('z % 3 == 0')}」となる。`}
    },
    {
      label:"ク", points:2, type:"single",
      qtext:`図5の(23)行目の空欄${B('ク')}に入れるものを選べ。${figLinks("図5")}`,
      choices:KUKO, correct:0,
      exp:{answer:"⓪（0）",
        text:`zを3で割った余りが0（割り切れる）ときは，zの3分の1の人数分の利用料金となる。よって(23)行目は「${code('z % 3 == 0')}」となり，${B('ク')}は0である。`}
    },
    {
      label:"ケ", points:2, type:"single",
      qtext:`図5の(26)行目　${code('z = (')}${B('ケ')}${code(') + ')}${B('コ')}　空欄${B('ケ')}に入れるものを選べ。${figLinks("図5")}`,
      choices:KK, correct:0,
      exp:{answer:"⓪（z ÷ 3）",
        text:`余りが1のときは，3で割ったときの商の人数＋1人分となる。余りが2のときは，その「2人」に対し1人分が無料になるので，結果的に余りが1のときと同じ計算となる。したがって，(26)行目の「${code('z = (')}${B('ケ')}${code(') + ')}${B('コ')}」は「${code('z = (z ÷ 3) + 1')}」となる。(27)〜(31)行目までは，図4での変数nyujoryoの計算と同様である。`}
    },

      label:"コ", points:3, type:"single",

      choices:KUKO, correct:1,
      exp:{answer:"①（1）",
        text:`余りが1または2のときは，3で割ったときの商の人数＋1人分の料金が必要になる。よって「${code('z = (z ÷ 3) + 1')}」となり，${B('コ')}は1である。<br>例：z＝4（余り1）のとき，1人分を払えば2人が無料で3人をカバーし，残り1人も払うので 4÷3＋1＝2人分。z＝5（余り2）のとき，残り2人のうち1人分を払えばもう1人は無料なので 5÷3＋1＝2人分。`}
    }
  ]

// ===== エンジン =====
let items = [];
sections.forEach((s, si) => s.items.forEach((it, ii) => { it._sec = si; items.push(it); }));
const state = items.map(it=>{
  if(it.type==='multi') return { sel:[], done:false };
  if(it.type==='digits') return { sel:Array(it.blanks).fill(''), done:false };
  if(it.type==='choicegroup') return { sel:Array(it.blanks.length).fill(null), done:false };
  return { sel:null, done:false };
});

function build() {
  let html = '';
  let gi = 0;
  sections.forEach((sec) => {
    html += `<div class="sec-title">${sec.title}</div>`;
    if (sec.context) html += `<div class="context">${sec.context}</div>`;
    sec.items.forEach((it) => {
      const idx = gi++;
      html += `<div class="q-card" id="q-${idx}">`;
      if (it.pre) html += `<div class="q-text">${it.pre}</div>`;
      html += `
        <div class="q-head">
          <span class="q-badge">${it.label}</span>
          <span class="q-point">${it.points}点</span>
          <span class="q-status" id="st-${idx}"></span>
        </div>
        <div class="q-text">${it.qtext}</div>`;

      if (it.type === 'digits') {
        html += `<div class="digits-row">`;
        if (it.prefixText) html += `<span class="digit-prefix">${it.prefixText}</span>`;
        for (let b=0;b<it.blanks;b++) {
          html += `<input type="tel" inputmode="numeric" maxlength="1" class="digit-box" id="d-${idx}-${b}" oninput="onDigitInput(${idx},${b},this)">`;
        }
        if (it.suffixText) html += `<span class="digit-suffix">${it.suffixText}</span>`;
        html += `</div>`;
      } else if (it.type === 'choicegroup') {
        it.blanks.forEach((bl, bi) => {
          html += `<div class="blank-group"><div class="blank-group-label">空欄${bl.label}</div><div class="choices">
            ${bl.choices.map((c, ci) => `
              <button class="choice-btn" id="c-${idx}-${bi}-${ci}" onclick="selectGroupChoice(${idx},${bi},${ci})">
                <span class="ci">${SYM[ci]}</span><span>${c}</span>
              </button>`).join('')}
          </div></div>`;
        });
      } else {
        html += `<div class="choices">
          ${it.choices.map((c, ci) => `
            <button class="choice-btn" id="c-${idx}-${ci}" onclick="${it.type==='multi'?`toggleChoice(${idx},${ci})`:`selectChoice(${idx},${ci})`}">
              <span class="ci">${SYM[ci]}</span><span>${c}</span>
            </button>`).join('')}
        </div>`;
        if (it.type === 'multi') {
          html += `<div class="pick-hint">※ ${it.pick}つ選択してください（<span id="pickcount-${idx}">0</span>/${it.pick}）</div>`;
        }
      }

      html += `
        <div class="action-row">
          <button class="btn-primary" id="sub-${idx}" onclick="submitAnswer(${idx})" disabled>回答する</button>
        </div>
        <div class="result-banner" id="rb-${idx}">
          <span id="ri-${idx}" style="font-size:1.2rem"></span>
          <span id="rt-${idx}"></span>
          <button class="explanation-link" onclick="openModal(${idx})">解説を見る</button>
        </div>
      </div>`;
    });
  });
  html += `
  <div id="final-area">
    <div class="action-row" style="justify-content:center">
      <button class="btn-primary" id="final-btn" onclick="showResult()" disabled>結果を見る（全問回答後に押せます）</button>
    </div>
    <div id="final-result"></div>
  </div>`;
  document.getElementById('quiz-area').innerHTML = html;
  document.getElementById('prog-label').textContent = `0 / ${items.length} 回答`;
}

function selectChoice(qi, ci) {
  if (state[qi].done) return;
  state[qi].sel = ci;
  items[qi].choices.forEach((_, j) => {
    document.getElementById(`c-${qi}-${j}`).classList.toggle('selected', j === ci);
  });
  document.getElementById(`sub-${qi}`).disabled = false;
}

function toggleChoice(qi, ci) {
  const st = state[qi], it = items[qi];
  if (st.done) return;
  const pos = st.sel.indexOf(ci);
  const btn = document.getElementById(`c-${qi}-${ci}`);
  if (pos >= 0) {
    st.sel.splice(pos, 1);
    btn.classList.remove('selected');
  } else {
    if (st.sel.length >= it.pick) return;
    st.sel.push(ci);
    btn.classList.add('selected');
  }
  document.getElementById(`pickcount-${qi}`).textContent = st.sel.length;
  document.getElementById(`sub-${qi}`).disabled = st.sel.length !== it.pick;
}

function onDigitInput(qi, bi, el) {
  const it = items[qi], st = state[qi];
  el.value = el.value.replace(/[^0-9]/g,'').slice(0,1);
  st.sel[bi] = el.value;
  if (el.value && bi < it.blanks-1) {
    const next = document.getElementById(`d-${qi}-${bi+1}`);
    if (next) next.focus();
  }
  document.getElementById(`sub-${qi}`).disabled = st.sel.some(v=>v==='');
}

function selectGroupChoice(qi, bi, ci) {
  const st = state[qi], it = items[qi];
  if (st.done) return;
  st.sel[bi] = ci;
  it.blanks[bi].choices.forEach((_, j) => {
    document.getElementById(`c-${qi}-${bi}-${j}`).classList.toggle('selected', j === ci);
  });
  document.getElementById(`sub-${qi}`).disabled = st.sel.some(v=>v===null);
}

function submitAnswer(qi) {
  const st = state[qi], it = items[qi];
  if (st.done) return;
  let ok = false;

  if (it.type === 'multi') {
    if (st.sel.length !== it.pick) return;
    const a = [...st.sel].sort(), b = [...it.correctSet].sort();
    ok = a.length === b.length && a.every((v,i)=>v===b[i]);
    st.done = true;
    it.choices.forEach((_, j) => {
      const b2 = document.getElementById(`c-${qi}-${j}`);
      b2.disabled = true;
      if (it.correctSet.includes(j)) b2.classList.add('correct');
      else if (st.sel.includes(j)) b2.classList.add('wrong');
      b2.classList.remove('selected');
    });
  } else if (it.type === 'digits') {
    if (st.sel.some(v=>v==='')) return;
    ok = st.sel.every((v,i)=>String(v)===String(it.correctDigits[i]));
    st.done = true;
    for (let b=0;b<it.blanks;b++) {
      const box = document.getElementById(`d-${qi}-${b}`);
      box.disabled = true;
      box.classList.add(String(st.sel[b])===String(it.correctDigits[b]) ? 'correct' : 'wrong');
    }
    if (!ok) {
      const row = document.getElementById(`d-${qi}-${it.blanks-1}`).parentElement;
      const span = document.createElement('span');
      span.className = 'digit-answer';
      span.textContent = `正解：${it.prefixText||''}${it.correctDigits.join('')}${it.suffixText||''}`;
      row.appendChild(span);
    }
  } else if (it.type === 'choicegroup') {
    if (st.sel.some(v=>v===null)) return;
    ok = it.blanks.every((bl,bi)=>st.sel[bi]===bl.correct);
    st.done = true;
    it.blanks.forEach((bl, bi) => {
      bl.choices.forEach((_, j) => {
        const b2 = document.getElementById(`c-${qi}-${bi}-${j}`);
        b2.disabled = true;
        if (j === bl.correct) b2.classList.add('correct');
        else if (j === st.sel[bi]) b2.classList.add('wrong');
        b2.classList.remove('selected');
      });
    });
  } else {
    if (st.sel === null) return;
    ok = st.sel === it.correct;
    st.done = true;
    document.getElementById(`sub-${qi}`).style.display = 'none';
    it.choices.forEach((_, j) => {
      const b = document.getElementById(`c-${qi}-${j}`);
      b.disabled = true; b.classList.remove('selected');
      if (j === it.correct) b.classList.add('correct');
      else if (j === st.sel && !ok) b.classList.add('wrong');
    });
  }

  if (it.type !== 'single') document.getElementById(`sub-${qi}`).style.display = 'none';

  const rb = document.getElementById(`rb-${qi}`);
  rb.classList.add('show', ok ? 'correct' : 'wrong');
  document.getElementById(`ri-${qi}`).textContent = ok ? '✓' : '✗';
  document.getElementById(`rt-${qi}`).textContent = ok ? '正解！' : ((it.type==='multi'&&it.partial&&scoreOf(qi)>0) ? `部分正解（${scoreOf(qi)}/${it.points}点）` : '不正解');
  document.getElementById(`st-${qi}`).textContent = ok ? '✓' : '✗';
  document.getElementById(`st-${qi}`).style.color = ok ? 'var(--correct)' : 'var(--wrong)';
  updateProgress();
}

function isCorrect(qi) {
  const st = state[qi], it = items[qi];
  if (it.type === 'multi') {
    const a=[...st.sel].sort(), b=[...it.correctSet].sort();
    return a.length===b.length && a.every((v,i)=>v===b[i]);
  }
  if (it.type === 'digits') {
    return st.sel.every((v,i)=>String(v)===String(it.correctDigits[i]));
  }
  if (it.type === 'choicegroup') {
    return it.blanks.every((bl,bi)=>st.sel[bi]===bl.correct);
  }
  return st.sel === it.correct;
}

function fmtUser(qi) {
  const st = state[qi], it = items[qi];
  if (it.type === 'multi') return st.sel.length ? st.sel.map(i=>SYM[i]).join('・') : '—';
  if (it.type === 'digits') return st.sel.join('');
  if (it.type === 'choicegroup') return st.sel.map(i=>i===null?'—':SYM[i]).join('／');
  return st.sel !== null ? SYM[st.sel] : '—';
}
function fmtCorrect(qi) {
  const it = items[qi];
  if (it.type === 'multi') return it.correctSet.map(i=>SYM[i]).join('・');
  if (it.type === 'digits') return `${it.prefixText||''}${it.correctDigits.join('')}${it.suffixText||''}`;
  if (it.type === 'choicegroup') return it.blanks.map(bl=>SYM[bl.correct]).join('／');
  return SYM[it.correct];
}

function updateProgress() {
  const done = state.filter(s => s.done).length;
  document.getElementById('prog-label').textContent = `${done} / ${items.length} 回答`;
  document.getElementById('prog-fill').style.width = `${(done / items.length) * 100}%`;
  const fb = document.getElementById('final-btn');
  if (done === items.length) { fb.disabled = false; fb.textContent = '結果を見る'; }
}

function showResult() {
  let correct = 0, points = 0, maxP = 0;
  const rows = items.map((it, i) => {
    maxP += it.points;
    const ok = isCorrect(i), sc = scoreOf(i);
    if (ok) correct++;
    points += sc;
    const mark = ok ? '○' : (sc>0 ? '△' : '✗');
    return `<tr><td>${it.label}</td><td>${fmtUser(i)}</td><td>${fmtCorrect(i)}</td><td class="${ok?'ok':'ng'}">${mark}</td><td>${sc}/${it.points}</td></tr>`;
  }).join('');
  document.getElementById('final-result').innerHTML = `
    <div class="q-card" style="text-align:center;margin-top:16px">
      <h2 style="font-size:1.3rem;color:var(--primary)">第3問 結果</h2>
      <div style="margin:14px 0">
        <span class="score-big">${correct}</span><span class="score-denom"> / ${items.length}問正解</span>
        <div style="color:var(--muted);margin-top:4px">獲得点数：${points} / ${maxP}点</div>
      </div>
      <table class="result-table">
        <tr><th>設問</th><th>あなた</th><th>正解</th><th>正誤</th><th>得点</th></tr>${rows}
      </table>
      <div style="margin-top:18px"><button class="btn-secondary" onclick="location.reload()">もう一度挑戦する</button></div>
    </div>`;
  document.getElementById('final-result').scrollIntoView({behavior:'smooth'});
}

function openModal(qi) {
  const it = items[qi], exp = it.exp;
  const opts = exp.options ? exp.options.map(o => `<div class="opt-exp ${o.ok?'ok':'ng'}"><span class="${o.ok?'label-ok':'label-ng'}">${o.label}</span>　${o.text}</div>`).join('') : '';
  document.getElementById('modal-title').textContent = `${it.label} 解説`;
  document.getElementById('modal-body').innerHTML = `<div class="correct-answer">✓ 正解：${exp.answer}</div><p>${exp.text}</p><div style="margin-top:10px">${opts}</div>`;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(e) { if (e.target === document.getElementById('modal-overlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal-overlay').classList.remove('show'); }

// ===== 図表ライトボックス =====
function openFig(key){
  const f=FIGS[key]; if(!f) return;
  document.getElementById('lb-img').src=f.src;
  document.getElementById('lb-img').alt=f.cap;
  document.getElementById('lb-cap').textContent=f.cap;
  document.getElementById('lb-body').classList.remove('zoom');
  document.getElementById('lb-zoom').textContent='拡大';
  document.getElementById('lb').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeFig(){ document.getElementById('lb').classList.remove('show'); document.body.style.overflow=''; }
function toggleZoom(){ const b=document.getElementById('lb-body'); b.classList.toggle('zoom'); document.getElementById('lb-zoom').textContent=b.classList.contains('zoom')?'縮小':'拡大'; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeFig(); } });

// 部分点（順不同の複数選択で1つ正解ごとに加点）
function scoreOf(qi){
  const it=items[qi], st=state[qi];
  if(it.type==='multi' && it.partial){ return st.sel.filter(v=>it.correctSet.includes(v)).length*it.partial; }
  return isCorrect(qi)?it.points:0;
}

build();
</script>
