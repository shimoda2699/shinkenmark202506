<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情報Ⅰ 全統マーク模試 過去問演習</title>

<style>
:root{
  --bg:#f0f4f8;
  --card:#ffffff;
  --border:#d0dae6;
  --shadow:0 4px 18px rgba(0,0,0,.08);

  --blue:#1a56a0;
  --blue-bg:#e8f0fb;

  --green:#2e7d32;
  --green-bg:#eaf6eb;

  --text:#1e2a3a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:#1a56a0;
  color:white;
  text-align:center;
  padding:24px;
}

header h1{
  font-size:1.5rem;
}

main{
  max-width:900px;
  margin:0 auto;
  padding:20px;
}

.year-section{
  background:white;
  border-radius:12px;
  box-shadow:var(--shadow);
  margin-bottom:24px;
  overflow:hidden;
}

.year-title{
  color:white;
  padding:14px 20px;
  font-size:1.2rem;
  font-weight:bold;
}

.year2025 .year-title{
  background:var(--blue);
}

.year2024 .year-title{
  background:var(--green);
}

.month-block{
  padding:20px;
  border-top:1px solid var(--border);
}

.month-title{
  font-size:1.05rem;
  font-weight:bold;
  margin-bottom:14px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.menu a{
  display:block;
  text-decoration:none;
  padding:16px;
  border-radius:10px;
  border:2px solid var(--border);
  color:var(--text);
  transition:.2s;
}

.year2025 .menu a:hover{
  background:var(--blue-bg);
  border-color:var(--blue);
}

.year2024 .menu a:hover{
  background:var(--green-bg);
  border-color:var(--green);
}

.qtitle{
  font-weight:bold;
  margin-bottom:4px;
}

.qdesc{
  font-size:0.85rem;
  color:#666;
}

.coming{
  color:#888;
  font-style:italic;
  padding:8px 0;
}

@media(max-width:600px){
  .menu{
    grid-template-columns:1fr;
  }
}

.portal-back{max-width:900px;margin:14px auto 0;padding:0 20px;}
.portal-back a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:8px 18px;border-radius:8px;font-weight:bold;font-size:.88rem;box-shadow:0 2px 8px rgba(0,0,0,.12);}
.portal-back a:hover{background:#154080;}
</style>
</head>

<body>

<header>
  <h1>情報Ⅰ 全統マーク模試 過去問演習</h1>
</header>

<div class="portal-back"><a href="index.html">← トップへ戻る</a></div>

<main>

  <!-- 2025年度 -->
  <section class="year-section year2025">

    <div class="year-title">2025年度</div>

    <div class="month-block">
      <div class="month-title">2025年11月<span style="font-weight:normal;font-size:0.8rem;color:#666">（全統マーク模試）</span></div>

      <div class="menu">
        <a href="zen202511_第1問.html">
          <div class="qtitle">第1問</div>
          <div class="qdesc">個人情報・著作権・不正アクセス・論理回路・関係データベース</div>
        </a>

        <a href="zen202511_第2問.html">
          <div class="qtitle">第2問</div>
          <div class="qdesc">レスポンシブデザイン・待ち行列のシミュレーション</div>
        </a>

        <a href="zen202511_第3問.html">
          <div class="qtitle">第3問</div>
          <div class="qdesc">プログラミング（入場料金の計算）</div>
        </a>

        <a href="zen202511_第4問.html">
          <div class="qtitle">第4問</div>
          <div class="qdesc">データの活用（プリンの販売数と回帰直線）</div>
        </a>
      </div>
    </div>

  </section>

</main>

</body>
</html>
